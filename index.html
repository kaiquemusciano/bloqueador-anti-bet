<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='black'/><text y='75' x='22' font-size='75' font-weight='bold' font-family='sans-serif' fill='%2322c55e'>B</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Você domina o jogo ou o jogo te domina? | Teste de Nível</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<div class="max-w-md mx-auto px-6 py-10">

  <div id="progressWrap" class="mb-6">
    <div class="h-2 bg-gray-800 rounded-full overflow-hidden">
      <div id="progressBar" class="h-2 bg-green-500 transition-all" style="width:0%"></div>
    </div>
    <p id="progressText" class="text-xs text-gray-500 mt-2 text-center">Pergunta 1 de 7</p>
  </div>

  <div id="quizArea"></div>

  <div id="resultArea" class="hidden text-center">
    <h1 class="text-2xl font-extrabold mb-3">Seu diagnóstico está pronto</h1>
    <p id="resultText" class="text-gray-400 mb-8"></p>
    <div class="bg-gray-900 border border-green-500 rounded-xl p-5 mb-6">
      <p class="font-semibold mb-2">O plano certo pra você:</p>
      <p class="text-sm text-gray-400">Com base nas suas respostas, montamos um ponto de partida realista — sem exigir que você "pare de uma vez", e sim trave o acesso enquanto reconstrói o controle.</p>
    </div>
    <a href="2-oferta.html"
       class="block bg-green-500 hover:bg-green-400 text-black font-bold py-4 rounded-lg text-lg">
      Ver meu plano de recuperação →
    </a>
  </div>

</div>

<script>
const questions = [
  { q: "Com que frequência você pensa em apostar quando não está apostando?", opts: ["Quase o tempo todo", "Várias vezes ao dia", "Algumas vezes por semana", "Raramente"] },
  { q: "Você já tentou parar de apostar sozinho(a) antes?", opts: ["Sim, várias vezes, sem sucesso", "Sim, uma vez", "Nunca tentei a sério", "Não preciso parar, só controlar"] },
  { q: "Você já pegou dinheiro emprestado ou usou dinheiro de contas fixas para apostar?", opts: ["Sim, mais de uma vez", "Sim, uma vez", "Cheguei perto disso", "Nunca"] },
  { q: "O que mais dispara a vontade de abrir o app de apostas?", opts: ["Estresse ou ansiedade", "Tédio", "Ver notificação/anúncio", "Tentar recuperar uma perda"] },
  { q: "Alguém próximo já demonstrou preocupação com seus hábitos de aposta?", opts: ["Sim, várias pessoas", "Sim, uma pessoa", "Já desconfiaram", "Ninguém sabe"] },
  { q: "Quanto tempo você consegue ficar sem abrir um app de apostas hoje?", opts: ["Menos de 1 dia", "Alguns dias", "Uma semana ou mais", "Não sei, nunca contei"] },
  { q: "O que você mais quer recuperar ao parar de apostar?", opts: ["Dinheiro", "Confiança da família", "Minha própria paz", "Tudo isso junto"] }
];

let current = 0;
const answers = [];

function render() {
  const area = document.getElementById('quizArea');
  if (current >= questions.length) {
    showResult();
    return;
  }
  const item = questions[current];
  document.getElementById('progressBar').style.width = ((current / questions.length) * 100) + '%';
  document.getElementById('progressText').textContent = `Pergunta ${current + 1} de ${questions.length}`;

  area.innerHTML = `
    <h2 class="text-xl font-bold mb-6">${item.q}</h2>
    <div class="space-y-3">
      ${item.opts.map((opt, i) => `
        <button onclick="answer(${i})"
          class="w-full text-left bg-gray-900 border border-gray-800 hover:border-green-500 rounded-lg px-4 py-3 transition">
          ${opt}
        </button>
      `).join('')}
    </div>
  `;
}

function answer(i) {
  answers.push(i);
  current++;
  render();
}

function showResult() {
  document.getElementById('progressWrap').classList.add('hidden');
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');

  const severity = answers.reduce((a, b) => a + b, 0);
  const msg = severity <= 7
    ? "Suas respostas mostram que você já está em um ponto de virada — o bloqueio técnico pode ser o empurrão final que faltava."
    : "Suas respostas mostram um padrão forte de recaída. Isso não é falta de caráter, é vício — e travar o acesso antes da decisão é o passo mais eficaz agora.";
  document.getElementById('resultText').textContent = msg;
}

render();
</script>

</body>
</html>
